behaviors:
  MazeAgent:
    trainer_type: ppo
    max_steps: 15000000          # más margen para curriculum completo

    hyperparameters:
      batch_size: 1024           # ajustado para 8 agentes
      buffer_size: 10240         # ~10× batch_size
      learning_rate: 2.0e-4
      learning_rate_schedule: linear
      beta: 3.0e-3               # menos exploración aleatoria
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 4

    network_settings:
      normalize: true            # deja que ML-Agents normalice las observaciones
      num_layers: 2              # no cambies esto todavía
      hidden_units: 128          # no cambies esto todavía
      memory:
        memory_size: 256         # LSTM: estado oculto de 256 valores
        sequence_length: 64      # aprende dependencias de 64 pasos

    reward_signals:
      extrinsic:
        gamma: 0.995             # horizonte más largo
        strength: 1.0

    time_horizon: 64             # debe ser >= sequence_length
    summary_freq: 5000
    keep_checkpoints: 5
    checkpoint_interval: 100000