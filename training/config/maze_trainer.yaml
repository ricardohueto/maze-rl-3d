behaviors:
  MazeAgent:
    trainer_type: ppo
    max_steps: 5000000

    hyperparameters:
      batch_size: 128
      buffer_size: 2048
      learning_rate: 3.0e-4
      learning_rate_schedule: linear
      beta: 5.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3

    network_settings:
      normalize: false
      num_layers: 2
      hidden_units: 128

    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0

    time_horizon: 64
    summary_freq: 10000
    keep_checkpoints: 5
    checkpoint_interval: 50000